<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Diagnostica pulsante hint</title>
    <style>html, body { margin: 0; height: 100%; } iframe { display: block; width: 100%; height: 100%; border: 0; }</style>
</head>
<body>
    <img src="/slow.png" alt="" width="1" height="1" style="position: absolute; opacity: 0;">
    <iframe id="frame" src="mappa.html"></iframe>
    <script>
        const frame = document.getElementById("frame");
        const report = (label) => {
            const doc = frame.contentDocument;
            const hint = doc.getElementById("map-gesture-hint");
            const panel = doc.getElementById("preview-map-panel");
            const rect = panel.getBoundingClientRect();
            return fetch("/report?data=" + encodeURIComponent(JSON.stringify({
                label,
                expanded: panel.classList.contains("is-expanded"),
                bodyClass: doc.body.className,
                fullscreenElement: doc.fullscreenElement ? doc.fullscreenElement.id : null,
                hintVisible: hint.classList.contains("is-visible"),
                panelRect: [Math.round(rect.x), Math.round(rect.y), Math.round(rect.width), Math.round(rect.height)],
                viewport: [frame.contentWindow.innerWidth, frame.contentWindow.innerHeight]
            })));
        };
        let started = false;
        setInterval(() => {
            const doc = frame.contentDocument;
            const win = frame.contentWindow;
            if (!doc) return;
            const dialog = doc.getElementById("entry-dialog");
            const accept = doc.getElementById("entry-accept");
            if (dialog && !dialog.hidden && accept) { accept.click(); return; }
            const guide = doc.getElementById("map-guide");
            if (guide && guide.open) {
                const skip = doc.getElementById("map-guide-skip");
                if (skip) skip.click();
                return;
            }
            const canvas = doc.querySelector("#preview-map canvas");
            if (!started && canvas) {
                started = true;
                const fire = () => canvas.dispatchEvent(new win.WheelEvent("wheel", {
                    deltaY: 120,
                    bubbles: true,
                    cancelable: true,
                    view: win
                }));
                fire();
                setInterval(fire, 700);
                setTimeout(() => {
                    report("before-click");
                    doc.getElementById("map-gesture-hint-expand").click();
                    setTimeout(() => report("after-click"), 700);
                }, 1200);
            }
        }, 200);
    </script>
</body>
</html>
